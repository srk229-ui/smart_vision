<text x="982.00" y="195.00" font-size="14" fill="#99adc7" text-anchor="middle" font-weight="400" >26</text>
<line x1="1094.00" y1="203.00" x2="1094.00" y2="654.00" stroke="#2c3c54" stroke-width="1" stroke-dasharray="3 5"/>
<text x="1094.00" y="195.00" font-size="14" fill="#99adc7" text-anchor="middle" font-weight="400" >27</text>
<line x1="1206.00" y1="203.00" x2="1206.00" y2="654.00" stroke="#2c3c54" stroke-width="1" stroke-dasharray="3 5"/>
<text x="1206.00" y="195.00" font-size="14" fill="#99adc7" text-anchor="middle" font-weight="400" >28</text>
<line x1="1318.00" y1="203.00" x2="1318.00" y2="654.00" stroke="#2c3c54" stroke-width="1" stroke-dasharray="3 5"/>
<text x="1318.00" y="195.00" font-size="14" fill="#99adc7" text-anchor="middle" font-weight="400" >29</text>
<line x1="1430.00" y1="203.00" x2="1430.00" y2="654.00" stroke="#2c3c54" stroke-width="1" stroke-dasharray="3 5"/>
<text x="1430.00" y="195.00" font-size="14" fill="#99adc7" text-anchor="middle" font-weight="400" >30</text>
<text x="28.00" y="282.00" font-size="17" fill="#ecf4ff" text-anchor="start" font-weight="650" >CPU这一窗</text>
<text x="28.00" y="304.00" font-size="12" fill="#99adc7" text-anchor="start" font-weight="400" >代码周期10 ms（未实测）</text>
<rect x="234.00" y="266.00" width="54.00" height="23.00" rx="6" fill="#131f32" stroke="#2c3c54" />
<text x="261.00" y="282.00" font-size="11" fill="#ffb277" text-anchor="middle" font-weight="600" >CPU</text>
