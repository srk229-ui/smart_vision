<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="784" viewBox="0 0 1480 784" role="img" aria-labelledby="zoom-title zoom-desc">
<title id="zoom-title">20至30毫秒：CPU执行时间与并行硬件</title><desc id="zoom-desc">CSI0.05加PIT0.20加视觉2.00加收发1.00等于3.25毫秒；其余6.75毫秒为未展开的主循环工作与预算，非实测空闲。</desc>
<defs><pattern id="zoom-other-hatch" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#233149"/><path d="M-2 2L2-2M0 9L9 0M7 11L11 7" stroke="#41546f" stroke-width="1"/></pattern><pattern id="zoom-motor-pattern" width="5" height="30" patternUnits="userSpaceOnUse"><rect width="5" height="30" fill="#261f36"/><path d="M1 26V4H3V26" fill="none" stroke="#e99bd2" stroke-width="0.8" opacity="0.55"/></pattern></defs>
<g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
<rect x="0.00" y="0.00" width="1480.00" height="784.00" rx="16" fill="#0b1220" stroke="none" />
<text x="28.00" y="38.00" font-size="25" fill="#ecf4ff" text-anchor="start" font-weight="700" >放大20—30 ms：这一有新帧的CPU窗口</text>
<rect x="1230.00" y="16.00" width="222.00" height="29.00" rx="6" fill="#131f32" stroke="#2c3c54" />
<text x="1341.00" y="36.00" font-size="14" fill="#ffb277" text-anchor="middle" font-weight="650" >离线示意 · 未实测</text>
<text x="28.00" y="67.00" font-size="14" fill="#99adc7" text-anchor="start" font-weight="400" >独立教学经过时间；所有执行耗时均是假设。所列任务3.25 ms，其余6.75 ms不代表实测空闲。</text>
<rect x="28.00" y="86.00" width="1424.00" height="68.00" rx="8" fill="#131f32" stroke="#2c3c54" />
<text x="44.00" y="106.00" font-size="12" fill="#68d7e5" text-anchor="start" font-weight="600" >代码已配置/换算（未实测）：PIT 10 ms；相机50 FPS / 20 ms；舵机50 Hz / 20 ms；电机17 kHz / 58.8 μs（每10 ms约170周期）。</text>
<text x="44.00" y="127.00" font-size="12" fill="#ffb277" text-anchor="start" font-weight="400" >教学CPU耗时：CSI 0.05 + PIT 0.20 + 视觉 2.00 + 收发 1.00 = 3.25 ms；按假设推演：其他主循环 / 余量6.75 ms。</text>
<text x="44.00" y="147.00" font-size="12" fill="#b6a1ff" text-anchor="start" font-weight="400" >初始F-1、舵机相位25 ms/中位脉宽1.5 ms也是教学假设；代码预算：单轮运行收发截止2 ms，实际耗时待实测。</text>
<line x1="310.00" y1="203.00" x2="310.00" y2="654.00" stroke="#2c3c54" stroke-width="1" stroke-dasharray="3 5"/>
<text x="310.00" y="195.00" font-size="14" fill="#99adc7" text-anchor="middle" font-weight="400" >20</text>
