<text x="450.00" y="288.00" font-size="15" fill="#0b1220" text-anchor="middle" font-weight="650" >视觉 F0（假设）</text>
<text x="450.00" y="313.00" font-size="14" fill="#0b1220" text-anchor="middle" font-weight="400" >2.00 ms</text>
<rect x="562.00" y="257.00" width="112.00" height="75.00" rx="0" fill="#79aaff" stroke="none" />
<text x="618.00" y="288.00" font-size="15" fill="#0b1220" text-anchor="middle" font-weight="650" >一次收发</text>
<text x="618.00" y="313.00" font-size="14" fill="#0b1220" text-anchor="middle" font-weight="400" >1 ms·假设</text>
<rect x="674.00" y="257.00" width="756.00" height="75.00" rx="0" fill="url(#zoom-other-hatch)" stroke="none" />
<text x="1052.00" y="288.00" font-size="15" fill="#ecf4ff" text-anchor="middle" font-weight="650" >其他主循环 / 示例余量（推演）</text>
<text x="1052.00" y="313.00" font-size="14" fill="#ecf4ff" text-anchor="middle" font-weight="400" >6.75 ms</text>
<line x1="312.80" y1="253.00" x2="349.20" y2="223.00" stroke="#f29ab6" stroke-width="1.5" />
<text x="356.20" y="222.00" font-size="13" fill="#f29ab6" text-anchor="start" font-weight="400" >CSI 0.05 ms（假设）</text>
<line x1="326.80" y1="335.00" x2="363.76" y2="359.00" stroke="#ffb277" stroke-width="1.5" />
<text x="370.76" y="366.00" font-size="13" fill="#ffb277" text-anchor="start" font-weight="400" >PIT CPU 0.20 ms（假设）</text>
<text x="28.00" y="401.00" font-size="14" fill="#99adc7" text-anchor="start" font-weight="400" >PIT内部：本次编码器 → 保护 → 速度斜坡 → 左右PI → 舵机命令限速 → 写寄存器。整块0.20 ms是假设。</text>
<text x="28.00" y="459.00" font-size="17" fill="#ecf4ff" text-anchor="start" font-weight="650" >相机采集/传输</text>
<text x="28.00" y="481.00" font-size="12" fill="#99adc7" text-anchor="start" font-weight="400" >代码50 FPS → 20 ms（换算，未测）</text>
<rect x="234.00" y="443.00" width="54.00" height="23.00" rx="6" fill="#131f32" stroke="#2c3c54" />
<text x="261.00" y="459.00" font-size="11" fill="#68d7e5" text-anchor="middle" font-weight="600" >硬件</text>
<rect x="310.00" y="438.00" width="1120.00" height="48.00" rx="5" fill="#243449" stroke="#4d7087" />
<text x="870.00" y="468.00" font-size="15" fill="#68d7e5" text-anchor="middle" font-weight="600" >F1 仍在采集 / 传输：20—40 ms（跨过当前10 ms窗）</text>
<text x="28.00" y="555.00" font-size="17" fill="#ecf4ff" text-anchor="start" font-weight="650" >舵机脉冲</text>
<text x="28.00" y="577.00" font-size="12" fill="#99adc7" text-anchor="start" font-weight="400" >代码50 Hz → 20 ms（换算，未测）</text>
<rect x="234.00" y="539.00" width="54.00" height="23.00" rx="6" fill="#131f32" stroke="#2c3c54" />
<text x="261.00" y="555.00" font-size="11" fill="#8ae0b2" text-anchor="middle" font-weight="600" >硬件</text>
<rect x="310.00" y="533.00" width="1120.00" height="65.00" rx="4" fill="#131f32" stroke="none" />
<line x1="310.00" y1="584.00" x2="1430.00" y2="584.00" stroke="#8ae0b2" stroke-width="1.5" />
<rect x="870.00" y="543.00" width="168.00" height="41.00" rx="0" fill="#1c4d3a" stroke="none" />
<path d="M 870.00 584 V 543 H 1038.00 V 584" fill="none" stroke="#8ae0b2" stroke-width="2"/>
<text x="877.00" y="570.00" font-size="13" fill="#8ae0b2" text-anchor="start" font-weight="600" >F-1 · 1.5 ms假设</text>
<text x="28.00" y="650.00" font-size="17" fill="#ecf4ff" text-anchor="start" font-weight="650" >电机PWM</text>
<text x="28.00" y="672.00" font-size="12" fill="#99adc7" text-anchor="start" font-weight="400" >代码17 kHz（未测）· 硬件连续</text>
<rect x="234.00" y="634.00" width="54.00" height="23.00" rx="6" fill="#131f32" stroke="#2c3c54" />
<text x="261.00" y="650.00" font-size="11" fill="#e99bd2" text-anchor="middle" font-weight="600" >硬件</text>
<rect x="310.00" y="633.00" width="1120.00" height="31.00" rx="4" fill="url(#zoom-motor-pattern)" stroke="#e99bd2" />
<g id="zoom-cursor" transform="translate(982.00 0)">
<line x1="0.00" y1="211.00" x2="0.00" y2="674.00" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.9"/>
<rect x="-47.00" y="180.00" width="94.00" height="24.00" rx="6" fill="#ecf4ff" stroke="none" />
<text x="0.00" y="197.00" font-size="13" fill="#0b1220" text-anchor="middle" font-weight="700" id="zoom-cursor-label">26.00 ms</text>
</g>
<rect x="28.00" y="698.00" width="1424.00" height="62.00" rx="8" fill="#131f32" stroke="#2c3c54" />
<text x="44.00" y="723.00" font-size="15" fill="#ecf4ff" text-anchor="start" font-weight="600" >相机20 ms与舵机20 ms是硬件时间，不从CPU10 ms预算里分摊；电机PWM持续自主输出。</text>
<text x="44.00" y="746.00" font-size="13" fill="#99adc7" text-anchor="start" font-weight="400" >任务不是固定槽位，余量不是睡眠；其他10 ms窗可没有新帧。视觉可跨周期被PIT打断，本例假设2 ms未跨。</text>
</g></svg>
